[project]
name = "tc03-cloud-mlops"
version = "0.1.0"
description = "Triagem automatica de urgencia de laudos medicos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "seaborn>=0.13",
    # Backend do DataFrame.to_markdown(), usado no notebook 07 para gerar a
    # tabela que vai para o Model Card.
    "tabulate>=0.9",
]
# Etapa 4 - otimizacao de latencia.
onnx = [
    "onnxruntime>=1.20",
    "skl2onnx>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
