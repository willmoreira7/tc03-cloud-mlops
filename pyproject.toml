[project]
name = "tc03-cloud-mlops"
version = "0.1.0"
description = "Triagem automatica de urgencia de laudos medicos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    # Roda o ruff dentro dos notebooks. Ver docs/NOTEBOOKS.md.
    "nbqa>=1.9",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "seaborn>=0.13",
    # Backend do DataFrame.to_markdown(), usado no notebook 07 para gerar a
    # tabela que vai para o Model Card.
    "tabulate>=0.9",
]
# Etapa 4 - otimizacao de latencia.
onnx = [
    "onnxruntime>=1.20",
    "skl2onnx>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
# `display` e builtin do kernel Jupyter; sem isso o ruff acusa F821 nos notebooks.
builtins = ["display"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# O nbqa converte cada notebook para um .py temporario antes de chamar o ruff,
# entao per-file-ignores com padrao "*.ipynb" nao casaria. A excecao vai aqui.
#
# E402 e a UNICA regra relaxada: notebook importa conforme a narrativa avanca,
# nao tudo na primeira celula. F401, F821 e E501 continuam valendo.
[tool.nbqa.addopts]
ruff = ["--extend-ignore=E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
