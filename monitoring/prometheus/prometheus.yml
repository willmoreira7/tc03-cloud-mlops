# Configuracao do Prometheus para a stack local de inferencia.
#
# O scrape usa o nome do servico no Compose (`api`), nunca `localhost`:
# dentro da rede do Docker, `localhost` e o proprio container do Prometheus.
#
# Valide com: promtool check config monitoring/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-inferencia
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
        labels:
          servico: triagem-laudos
