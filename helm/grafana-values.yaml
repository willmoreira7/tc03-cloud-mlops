# Grafana - chart grafana-community/grafana 13.2.4
# (grafana/grafana foi descontinuado; o chart mudou para grafana-community)
#
#   helm repo add grafana-community https://grafana-community.github.io/helm-charts
#   helm upgrade --install grafana grafana-community/grafana --version 13.2.4 \
#     -n monitoring -f grafana-values.yaml
#
# Senha do admin (secret criado antes do install):
#   kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
# Acesso: kubectl -n monitoring port-forward svc/grafana 3000:80

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true
  type: pvc
  size: 2Gi
  storageClassName: gp2

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

service:
  type: ClusterIP

# DNS: Ingress ALB compartilhado (group.name mlops-tools, um unico ALB para
# Airflow, Grafana e Prometheus) com HTTPS. Sem certificate-arn: o controller
# descobre no ACM o certificado que cobre o host (*.pocsarcotech.com).
# O registro no Route53 (zona publica pocsarcotech.com) e um alias A manual
# apontando para o ALB -- o cluster nao tem external-dns.
ingress:
  enabled: true
  ingressClassName: alb
  hosts:
    - grafana.pocsarcotech.com
  path: /
  pathType: Prefix
  annotations:
    alb.ingress.kubernetes.io/group.name: mlops-tools
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/health

grafana.ini:
  server:
    root_url: https://grafana.pocsarcotech.com

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        jsonData:
          timeInterval: 30s

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes

# Dashboards publicos do grafana.com, baixados no startup.
dashboards:
  kubernetes:
    node-exporter-full:
      gnetId: 1860
      revision: 45
      datasource: Prometheus
    k8s-views-global:
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    k8s-views-namespaces:
      gnetId: 15758
      revision: 46
      datasource: Prometheus
    k8s-views-pods:
      gnetId: 15760
      revision: 39
      datasource: Prometheus
