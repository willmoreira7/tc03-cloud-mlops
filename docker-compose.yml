# Stack local de inferencia + observabilidade (Etapa 3).
#
#   docker compose up --build
#   API:         http://localhost:8000/docs
#   Prometheus:  http://localhost:9090
#   Grafana:     http://localhost:3000  (admin / admin)
#
# Para popular os graficos apos subir:
#   uv run python scripts/generate_load.py --url http://localhost:8000

services:
  api:
    build:
      context: .
      target: runtime
    image: tc03-triagem-api:latest
    container_name: tc03-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - triagem

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tc03-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped
    networks:
      - triagem

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tc03-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - triagem

volumes:
  prometheus-data:
  grafana-data:

networks:
  triagem:
    driver: bridge
